<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SamePage staff review</title>
  <script>
    // Keep relative asset paths working whether the page is served at /staff or /staff/.
    if (!/\/$|\.html$/.test(location.pathname)) {
      document.write('<base href="' + location.pathname + '/">');
    }
    // Development aid: ?api=http://127.0.0.1:8001 points the page at the mock API.
    (function () {
      var api = new URLSearchParams(location.search).get("api");
      if (api && !window.SAMEPAGE_API_BASE) window.SAMEPAGE_API_BASE = api;
    })();
  </script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <p class="brand"><span class="brand-mark" aria-hidden="true"></span>SamePage<span class="brand-area">Staff review</span></p>
    <p class="role-note"><span class="pill-note">Fictional data</span><span class="pill-note">Simulated staff role</span></p>
  </header>

  <main class="shell">
    <section class="queue" aria-labelledby="queue-title">
      <div class="queue-head">
        <h1 id="queue-title">Requests</h1>
        <button type="button" id="refresh" class="icon-button" aria-label="Refresh requests" title="Refresh"></button>
      </div>
      <div class="views" id="views" role="group" aria-label="Show"></div>
      <form class="tools" id="filters" aria-label="Filter requests">
        <label class="search">
          <span class="visually-hidden">Search requests</span>
          <input type="search" id="search" placeholder="Search requests" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <label class="category">
          <span class="visually-hidden">Category</span>
          <select id="filter-category"><option value="">All categories</option></select>
        </label>
      </form>
      <p id="queue-status" class="queue-status" role="status" aria-live="polite"></p>
      <ol id="case-list" class="case-list"></ol>
      <p class="queue-foot" aria-hidden="true"><kbd>J</kbd><kbd>K</kbd> move between requests</p>
    </section>

    <section class="case" id="case" aria-label="Selected request" tabindex="-1">
      <div class="placeholder">
        <p class="placeholder-title">Select a request</p>
        <p>You'll see what the client said, what they confirmed, and the account facts behind it.</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
